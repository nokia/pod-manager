# Required metadata
sonar.projectKey=kptdev_pod-manager
sonar.projectName=pod-manager
sonar.organization=kptdev

sonar.language=go

# Go modules to analyze
sonar.sources=api,manager,wrapper-server

# Exclude generated code, tests and non-source files
sonar.exclusions=**/*_test.go, **/testdata/**, **/generated/**, **/*zz_generated.*, **/*.pb.go, .github/**, .build/**

# Test files and coverage
sonar.test.inclusions=**/*_test.go
sonar.coverage.exclusions=**/*_test.go,**/generated/**,**/*zz_generated.*,**/*.pb.go

# Coverage reports, one per module (not produced by CI yet)
sonar.go.coverage.reportPaths=api/coverage.out,manager/coverage.out,wrapper-server/coverage.out

# Exclude duplicated blocks from CPD (Copy-Paste Detection)
sonar.cpd.exclusions=**/*_test.go, **/generated/**, **/*zz_generated.*, **/*.pb.go
