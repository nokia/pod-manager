# Builds the container images and pushes them to ghcr.io for a release tag. It
# is called by release.yml once the release tags exist, and follows VERSIONING.md
# in kptdev/governance: every release publishes its own immutable tag (v1.2.3 or
# v1.2.3-pre.1), and only non-prerelease releases move the stable tag.

name: Release images
on:
  workflow_call:
    inputs:
      version:
        description: Release version and tag to build, e.g. v1.2.3 or v1.2.3-pre.1
        required: true
        type: string

jobs:
  images:
    name: image-${{ matrix.image }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: pod-manager
            dockerfile: manager/Dockerfile
          - image: wrapper-server
            dockerfile: wrapper-server/Dockerfile
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.version }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to ghcr.io
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          # "latest" is reserved for main builds, so disable the automatic one.
          flavor: latest=false
          tags: |
            type=raw,value=${{ inputs.version }}
            type=raw,value=stable,enable=${{ !contains(inputs.version, '-') }}
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ inputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
