# Go CI workflow for build, test, and lint.
#
# Do not use workflow-level paths-ignore for required checks.
# GitHub leaves skipped required workflows Pending forever.
# Instead, we always run the workflow and skip individual jobs conditionally.
# See: https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#onpull_requestpull_request_targetpathspaths-ignore

name: Go
on:
  pull_request:
  push:
    branches-ignore:
    - 'dependabot/**'

jobs:
  # Detect which path groups changed to conditionally skip expensive jobs.
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            code:
              - 'api/**'
              - 'manager/**'
              - 'wrapper-server/**'
              - 'Makefile'
              - 'make/**'
              - '.golangci.yml'
              - '.github/workflows/go.yml'

  build-test:
    name: build-test
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: manager/go.mod
          cache-dependency-path: |
            api/go.sum
            manager/go.sum
            wrapper-server/go.sum
      - name: Lint
        run: make lint
      - name: Build
        run: make build
      - name: Test
        run: make test

  build-macos:
    name: build-macos
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: manager/go.mod
          cache-dependency-path: |
            api/go.sum
            manager/go.sum
            wrapper-server/go.sum
      - name: Build
        run: make build

  go-gate:
    name: go
    needs: [changes, build-test, build-macos]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          # If no code changes, this check is not applicable, pass.
          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "changes job did not succeed"
            exit 1
          fi
          if [ "${{ needs.changes.outputs.code }}" = "false" ]; then
            echo "No code changes, skipping Go tests"
            exit 0
          fi

          # If any required job failed, cancelled, or skipped, fail this check.
          if [ "${{ needs.build-test.result }}" != "success" ] || \
             [ "${{ needs.build-macos.result }}" != "success" ]; then
            echo "Go tests failed or did not complete"
            exit 1
          fi

          echo "Go tests passed"
