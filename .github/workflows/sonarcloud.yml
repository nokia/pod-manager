# SonarCloud analysis, configured by sonar.properties.
#
# The scan only runs when the SONAR_TOKEN secret is available. Until a token
# is added in the repository settings (Settings > Secrets and variables >
# Actions), and for pull requests from forks, the job is skipped with a notice.
#
# TODO: produce coverage.out per module in the Go workflow and pass it here, as
# kpt does with its coverage artifacts and workflow_run based scan.

name: SonarCloud analysis
on:
  pull_request:
  push:
    branches:
      - main

jobs:
  sonarcloud:
    name: sonarcloud
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Check for SonarCloud token
        id: token
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::notice title=SonarCloud skipped::SONAR_TOKEN is not available (not configured yet, or a fork pull request). Skipping the analysis."
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Check out code
        if: steps.token.outputs.available == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: SonarCloud scan
        if: steps.token.outputs.available == 'true'
        uses: SonarSource/sonarqube-scan-action@70bad232163b09d998ea0707ee80c0ec80798c16 # v8.5.1
        with:
          args: >-
            -Dsonar.host.url=https://sonarcloud.io
            -Dproject.settings=sonar.properties
