# Builds the container images on pull requests without pushing them, and
# checks that each image starts. Releases are pushed by release-images.yml.
#
# Do not use workflow-level paths-ignore for required checks.
# GitHub leaves skipped required workflows Pending forever.
# Instead, we always run the workflow and skip individual jobs conditionally.

name: Images
on:
  pull_request:

jobs:
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.filter.outputs.images }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            images:
              - 'api/**'
              - 'manager/**'
              - 'wrapper-server/**'
              - '.dockerignore'
              - '.github/workflows/images.yml'

  build-image:
    name: build-image-${{ matrix.image }}
    needs: changes
    if: needs.changes.outputs.images == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: pod-manager
            dockerfile: manager/Dockerfile
          - image: wrapper-server
            dockerfile: wrapper-server/Dockerfile
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: false
          load: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:pr-${{ github.event.number }}
          cache-from: type=gha,scope=${{ matrix.image }}
      - name: Check image runs
        run: docker run --rm ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:pr-${{ github.event.number }} --help

  images-gate:
    name: images
    needs: [changes, build-image]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          # If no image-related changes, this check is not applicable, pass.
          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "changes job did not succeed"
            exit 1
          fi
          if [ "${{ needs.changes.outputs.images }}" = "false" ]; then
            echo "No image-related changes, skipping image builds"
            exit 0
          fi

          # If any required job failed, cancelled, or skipped, fail this check.
          if [ "${{ needs.build-image.result }}" != "success" ]; then
            echo "Image builds failed or did not complete"
            exit 1
          fi

          echo "Image builds passed"
