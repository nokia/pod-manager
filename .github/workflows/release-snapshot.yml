# Validates the goreleaser configuration and builds a snapshot release (binaries
# and images, nothing is published), when the release configuration or anything it
# builds from changes (the Go modules, which also covers ldflags and module layout).
#
# Do not use workflow-level paths-ignore for required checks.
# GitHub leaves skipped required workflows Pending forever.
# Instead, we always run the workflow and skip individual jobs conditionally.

name: Release Snapshot
on:
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.filter.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            release:
              - '.goreleaser.yaml'
              - '**/Dockerfile.goreleaser'
              - 'api/**'
              - 'manager/**'
              - 'wrapper-server/**'
              - 'LICENSE'
              - '.github/workflows/release-snapshot.yml'

  goreleaser-snapshot:
    name: goreleaser-snapshot
    needs: changes
    if: needs.changes.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: manager/go.mod
          cache: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Validate GoReleaser config
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check
      - name: Snapshot release
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean

  release-snapshot-gate:
    name: release-snapshot
    needs: [changes, goreleaser-snapshot]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          # If no release changes, this check is not applicable, pass.
          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "changes job did not succeed"
            exit 1
          fi
          if [ "${{ needs.changes.outputs.release }}" = "false" ]; then
            echo "No release changes, skipping GoReleaser snapshot"
            exit 0
          fi

          # If any required job failed, cancelled, or skipped, fail this check.
          if [ "${{ needs.goreleaser-snapshot.result }}" != "success" ]; then
            echo "GoReleaser snapshot failed or did not complete"
            exit 1
          fi

          echo "GoReleaser snapshot passed"
